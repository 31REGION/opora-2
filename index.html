<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10253b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Опора">
  <meta name="description" content="Дневник дня, питания, сна, тренировок и небольших шагов. Данные хранятся только на устройстве.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <title>Опора 2 — дневник дня, питания и спорта</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">✳</span><span>Опора<span class="brand-sub">один шаг за раз</span></span></div>
      <span class="privacy-indicator" title="Без регистрации, без сервера">● Локальный дневник</span>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Разделы приложения">
      <button type="button" data-tab="today" class="nav-item active"><span class="nav-ico">◉</span><span>Сегодня</span></button>
      <button type="button" data-tab="day" class="nav-item"><span class="nav-ico">▤</span><span>Мой день</span></button>
      <button type="button" data-tab="health" class="nav-item"><span class="nav-ico">♡</span><span>Спорт/еда</span></button>
      <button type="button" data-tab="progress" class="nav-item"><span class="nav-ico">▥</span><span>Итоги</span></button>
      <button type="button" data-tab="exchange" class="nav-item"><span class="nav-ico">⇄</span><span>Обмен</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="app.js"></script>
</body>
</html>
